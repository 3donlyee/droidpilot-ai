name: Build and Release DroidPilot AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Generate Dummy debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidPilot-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "DroidPilot AI v1.0.0 APK"
          body: |
            ## DroidPilot AI v1.0.0 Release 🚀
            - Target Device: OPPO Reno5 (Android 13, CPH2159, No Root)
            - Autonomous Tool Loop with Cloudflare Workers AI
            - AccessibilityService Gesture & Element Navigation
            - Zero-screenshot primary execution policy
          draft: false
          prerelease: false
