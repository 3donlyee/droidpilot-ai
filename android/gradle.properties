# DroidPilot AI — gradle.properties
# Project-wide Gradle / JVM / Kotlin settings.

# Kotlin code style ('official' recommended over 'obsolete')
kotlin.code.style=official

# AndroidX — required for all AndroidX libraries
android.useAndroidX=true

# Gradle performance flags
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin / KGP
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m

# Android non-transitive R class (smaller R classes, faster build)
android.nonTransitiveRClass=true
